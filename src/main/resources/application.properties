spring.application.name=gestorclips

# Conexion a MongoDB. Por defecto usa el MongoDB local.
# Para usar Atlas (nube), define la variable de entorno MONGODB_URI con tu cadena de conexion
# (NUNCA escribas la contrasena en este archivo).
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/test}
spring.data.mongodb.auto-index-creation=true
server.port=8080

# Mostrar el detalle del error en la respuesta (solo para desarrollo)
server.error.include-message=always
server.error.include-exception=true

# Permitir subir chats grandes (streams largos)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Ruta del TwitchDownloaderCLI (para analizar pegando el link del VOD)
# Se puede cambiar con la variable de entorno TWITCH_DOWNLOADER_PATH
twitch.downloader.path=${TWITCH_DOWNLOADER_PATH:C:/TwitchDownloaderCLI-1.56.5-Windows-x64/TwitchDownloaderCLI.exe}
